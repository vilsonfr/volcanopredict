services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: volcanopredict
      POSTGRES_USER: volcano
      POSTGRES_PASSWORD: volcano
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://volcano:volcano@db:5432/volcanopredict?sslmode=disable
      HTTP_ADDR: :8080
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
